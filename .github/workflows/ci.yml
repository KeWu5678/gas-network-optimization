name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install (locked)
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check src tests examples
      - name: Type check
        run: uv run mypy
      - name: Tests
        # GasLib/TRR154 data is not redistributed; those tests skip and the
        # gas code path is covered by the synthetic fixture in tests/fixtures
        run: uv run pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build reproducibility image
        run: docker build -t gasnetopt .
      - name: Test suite inside the image
        run: docker run --rm gasnetopt
