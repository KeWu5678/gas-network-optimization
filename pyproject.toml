[project]
name = "gasnetopt"
version = "0.1.0"
description = "Mixed-integer optimal control of transmission lines and gas networks via partial outer convexification, CIAP and penalty ADM"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "TRR154 gas network optimization project" },
]
dependencies = [
    "casadi>=3.6",
    "numpy>=1.24",
    "scipy>=1.9",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
gurobi = ["gurobipy>=10"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gasnetopt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
